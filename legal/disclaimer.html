      <h1>의료정보 고지</h1>
      <p>케어로컬의 모든 콘텐츠는 병원 방문 전 확인을 돕기 위한 일반 정보입니다. 의사의 진단, 치료, 처방, 응급 판단을 대신하지 않습니다.</p>
      <p>병원 진료시간, 진료과목, 예약 가능 여부, 접수 마감 시간은 병원 사정에 따라 변경될 수 있습니다. 방문 전 반드시 해당 병원에 직접 확인하시기 바랍니다.</p>
      <p>응급 증상이 있거나 즉각적인 처치가 필요한 경우에는 119 또는 가까운 응급실을 이용하세요.</p>
