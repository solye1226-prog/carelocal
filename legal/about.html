      <h1>사이트 소개</h1>
      <p>케어로컬은 지역별 병원 진료 정보를 정리하고, 병원 방문 전 사용자가 확인해야 할 사항을 안내하는 정보 사이트입니다.</p>
      <p>진료시간, 예약 가능 여부, 진료과목, 접수 마감 시간 등은 병원 사정에 따라 변경될 수 있으므로, 사용자는 방문 전 병원 공식 채널을 통해 최신 정보를 확인해야 합니다.</p>
      <h2>운영 방향</h2>
      <ul>
        <li>지역과 진료과 중심의 병원 정보 정리</li>
        <li>일요일, 야간, 공휴일 등 특수 진료 수요에 맞춘 안내</li>
        <li>의료 판단이 아닌 병원 이용 전 확인 정보 제공</li>
      </ul>
