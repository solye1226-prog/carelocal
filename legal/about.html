      <h1>사이트 소개</h1>
      <p>케어로컬은 지역별 병원 정보를 정리하고, 중증진료나 암센터 방문 전 확인해야 할 항목을 안내하는 정보 사이트입니다.</p>
      <p>진료시간, 예약 가능 여부, 진료과목, 접수 마감 시간은 병원 사정에 따라 변경될 수 있으므로 사용자는 방문 전 병원 공식 채널을 통해 최신 정보를 확인해야 합니다.</p>
      <h2>운영 방향</h2>
      <ul>
        <li>지역과 진료 유형 중심의 병원 정보 정리</li>
        <li>암센터, 응급의료, 정신건강 등 준비가 필요한 진료 맥락 안내</li>
        <li>의료 판단이 아닌 방문 전 확인 정보 제공</li>
      </ul>
