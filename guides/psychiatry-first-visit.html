      <h1>정신건강의학과 첫 방문 준비</h1>
      <p class="lead">첫 진료는 현재 증상과 생활 변화, 수면, 복용약을 차분히 정리해 가면 상담에 도움이 됩니다.</p>
      <h2>준비하면 좋은 내용</h2>
      <ul>
        <li>증상이 시작된 시점과 악화되는 상황</li>
        <li>수면, 식욕, 집중력, 일상생활 변화</li>
        <li>현재 복용 중인 약과 이전 진료 기록</li>
        <li>상담에서 꼭 묻고 싶은 질문</li>
      </ul>
      <div class="notice">자해 위험이나 급박한 위기 상황에서는 예약을 기다리지 말고 119, 응급실, 지역 위기상담 창구를 이용하세요.</div>
